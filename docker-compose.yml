services:
  db:
    image: postgres:15-alpine
    container_name: alqaiser_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    # DON'T expose port to host - containers can communicate internally
    environment:
      - POSTGRES_DB=Al-Qaiser_Hub
      - POSTGRES_USER=alqaiser_user
      - POSTGRES_PASSWORD=12345
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alqaiser_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  backend:
    build:
      context: ./backend
      target: development
    container_name: alqaiser_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=1
      - DB_HOST=db  # Changed from localhost to db (container name)
      - DB_NAME=Al-Qaiser_Hub
      - DB_USER=alqaiser_user
      - DB_PASSWORD=12345
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev_network

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: alqaiser_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge

volumes:
  postgres_data_dev: