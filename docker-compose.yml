services:
  db:
    image: postgres:15-alpine
    container_name: alqaiser_db_dev
    ports:
      - "5433:5432"  # Host:5433 -> Container:5432
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=alqaiser_hub
      - POSTGRES_USER=alqaiser_user
      - POSTGRES_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alqaiser_user -d alqaiser_hub" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  backend:
    build:
      context: ./backend
      target: development
    container_name: alqaiser_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh /app/entrypoint.sh
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=alqaiser_hub
      - DB_USER=alqaiser_user
      - DB_PASSWORD=123456
      - DB_PORT=5432  # Container port, not host port
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev_network

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: alqaiser_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge

volumes:
  postgres_data_dev: