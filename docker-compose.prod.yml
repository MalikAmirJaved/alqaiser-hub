services:
  db:
    image: postgres:15-alpine
    container_name: alqaiser_db_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alqaiser_redis_prod
    restart: always

  backend:
    build:
      context: ./backend
      target: production
    container_name: alqaiser_backend_prod
    ports:
      - "8000:8000"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: alqaiser_frontend_prod
    ports:
      - "3000:3000"
    command: npm run start
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  postgres_data_prod:
  static_volume:
  media_volume: